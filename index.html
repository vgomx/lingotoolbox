<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./mark-violet.svg" />
    <!-- iOS ignores the manifest's icons and reads this instead. -->
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <!-- --ink-700, so the browser chrome matches the app surface rather than
         flashing white around it. -->
    <meta name="theme-color" content="#23232F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Lingo Toolbox — practise the words you nearly know</title>
    <meta
      name="description"
      content="An open-source set of language-learning tools: flashcards with spaced repetition, an etymology explorer, conjugation drills, a phrasebook and grammar notes."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
